name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Byte-compile
        run: uv run python -m compileall -q -x '\.venv' .

      - name: Smoke test
        run: uv run python tests/smoke_test.py
