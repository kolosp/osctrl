[project]
name = "osctrl"
version = "0.1.0"
description = "Autonomous OS control agent driven by Gemini Flash Lite"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kolosp", email = "kelemenk@sch.bme.hu" }]
keywords = ["gemini", "ai-agent", "computer-use", "automation", "pyautogui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "google-genai>=1.0.0",
    "mss>=9.0.0",
    "pyautogui>=0.9.54",
    "Pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/kolosp/osctrl"
Repository = "https://github.com/kolosp/osctrl"
Issues = "https://github.com/kolosp/osctrl/issues"
